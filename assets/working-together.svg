<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Jak pracujemy: rozmowa i diagnoza potrzeb; plan projektu i finansowania; wdrożenie oraz szkolenia; rozwój, utrzymanie i analiza efektów.</title><defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#141819" opacity=".1"/></pattern><clipPath id="frame"><rect width="960" height="600" rx="20"/></clipPath></defs><g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif"><rect width="960" height="600" fill="#f5f1e8"/><text x="36" y="45" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">OD PIERWSZEJ ROZMOWY DO DALSZEGO ROZWOJU</text><text x="34" y="98" font-size="42" fill="#141819" font-weight="700" letter-spacing="-1">Wspólnie. Krok po kroku.</text><path d="M36 136h416" stroke="#ccc8bf"/><text x="36" y="201" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">01</text><text x="136" y="177" font-size="34" fill="#141819" font-weight="700" >Rozmowa</text><text x="136" y="215" font-size="22" fill="#40464a" font-weight="400" >Poznajemy misję, ludzi</text><text x="136" y="244" font-size="22" fill="#40464a" font-weight="400" >i potrzeby organizacji.</text><text x="136" y="292" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">DIAGNOZA / KIERUNEK</text><path d="M508 136h416" stroke="#ccc8bf"/><text x="508" y="201" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">02</text><text x="608" y="177" font-size="34" fill="#141819" font-weight="700" >Plan</text><text x="608" y="215" font-size="22" fill="#40464a" font-weight="400" >Łączymy zakres, budżet</text><text x="608" y="244" font-size="22" fill="#40464a" font-weight="400" >i możliwości finansowania.</text><text x="608" y="292" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">STRATEGIA / GRANTY</text><path d="M36 361h416" stroke="#ccc8bf"/><text x="36" y="426" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">03</text><text x="136" y="402" font-size="34" fill="#141819" font-weight="700" >Wdrożenie</text><text x="136" y="440" font-size="22" fill="#40464a" font-weight="400" >Budujemy narzędzia.</text><text x="136" y="469" font-size="22" fill="#40464a" font-weight="400" >Przygotowujemy zespół.</text><text x="136" y="517" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">PRODUKT / SZKOLENIA</text><path d="M508 361h416" stroke="#ccc8bf"/><text x="508" y="426" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">04</text><text x="608" y="402" font-size="34" fill="#141819" font-weight="700" >Rozwój</text><text x="608" y="440" font-size="22" fill="#40464a" font-weight="400" >Utrzymanie, automatyzacja</text><text x="608" y="469" font-size="22" fill="#40464a" font-weight="400" >i analiza efektów.</text><text x="608" y="517" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">WSPARCIE / REZULTATY</text></g></svg>
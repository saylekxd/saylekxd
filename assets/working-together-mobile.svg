<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1010" viewBox="0 0 480 1010" role="img" aria-labelledby="title"><title id="title">Jak pracujemy: rozmowa i diagnoza potrzeb; plan projektu i finansowania; wdrożenie oraz szkolenia; rozwój, utrzymanie i analiza efektów.</title><defs><pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#141819" opacity=".1"/></pattern><clipPath id="frame"><rect width="480" height="1010" rx="20"/></clipPath></defs><g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif"><rect width="480" height="1010" fill="#f5f1e8"/><text x="36" y="45" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">OD PIERWSZEJ ROZMOWY DO DALSZEGO ROZWOJU</text><text x="34" y="98" font-size="32" fill="#141819" font-weight="700" letter-spacing="-1">Wspólnie. Krok po kroku.</text><path d="M36 128h408" stroke="#ccc8bf"/><text x="36" y="193" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">01</text><text x="136" y="169" font-size="34" fill="#141819" font-weight="700" >Rozmowa</text><text x="136" y="207" font-size="20" fill="#40464a" font-weight="400" >Poznajemy misję, ludzi</text><text x="136" y="236" font-size="20" fill="#40464a" font-weight="400" >i potrzeby organizacji.</text><text x="136" y="284" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">DIAGNOZA / KIERUNEK</text><path d="M36 343h408" stroke="#ccc8bf"/><text x="36" y="408" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">02</text><text x="136" y="384" font-size="34" fill="#141819" font-weight="700" >Plan</text><text x="136" y="422" font-size="20" fill="#40464a" font-weight="400" >Łączymy zakres, budżet</text><text x="136" y="451" font-size="20" fill="#40464a" font-weight="400" >i możliwości finansowania.</text><text x="136" y="499" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">STRATEGIA / GRANTY</text><path d="M36 558h408" stroke="#ccc8bf"/><text x="36" y="623" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">03</text><text x="136" y="599" font-size="34" fill="#141819" font-weight="700" >Wdrożenie</text><text x="136" y="637" font-size="20" fill="#40464a" font-weight="400" >Budujemy narzędzia.</text><text x="136" y="666" font-size="20" fill="#40464a" font-weight="400" >Przygotowujemy zespół.</text><text x="136" y="714" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">PRODUKT / SZKOLENIA</text><path d="M36 773h408" stroke="#ccc8bf"/><text x="36" y="838" font-size="64" fill="#244bdb" font-weight="700" letter-spacing="-4">04</text><text x="136" y="814" font-size="34" fill="#141819" font-weight="700" >Rozwój</text><text x="136" y="852" font-size="20" fill="#40464a" font-weight="400" >Utrzymanie, automatyzacja</text><text x="136" y="881" font-size="20" fill="#40464a" font-weight="400" >i analiza efektów.</text><text x="136" y="929" font-size="12" fill="#244bdb" font-weight="700" letter-spacing="1.1">WSPARCIE / REZULTATY</text></g></svg>